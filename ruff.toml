line-length = 120
indent-width = 4
target-version = "py312"

[lint]
select = [
    "E",
    "F",
    "I",
    "C90",
    "RUF100",
    "T20",
]
mccabe.max-complexity = 12
ignore = [
    "E501",
]

[lint.per-file-ignores]
"{scripts,requirements}/*" = ["T20"]

[lint.isort]
case-sensitive = false
force-single-line = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false
