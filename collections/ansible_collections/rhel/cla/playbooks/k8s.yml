---
# Deploy RHEL CLA to Kubernetes / OpenShift using role k8s Jinja templates.
# Primary interfaces (same pattern as rhel.cla.local):
#   ./rhel-cla-installer rhel.cla.k8s -e @examples/openshift-lab-vars.yml
#   ansible-playbook -i localhost, -c local \
#     collections/ansible_collections/rhel/cla/playbooks/k8s.yml \
#     -e @examples/openshift-lab-vars.yml
- name: Setup RHEL CLA in K8S
  hosts: localhost
  gather_facts: false
  become: false
  collections:
    - kubernetes.core

  tasks:
    - name: Shared namespace / NetPol / quota / optional Granite Job
      ansible.builtin.import_role:
        name: rhel.cla.cla_k8s
        tasks_from: k8s

    - name: Offline Knowledge Portal
      ansible.builtin.import_role:
        name: rhel.cla.okp
        tasks_from: k8s

    - name: RHEL Knowledge Bridge
      ansible.builtin.import_role:
        name: rhel.cla.rhel_knowledge_bridge
        tasks_from: k8s

    - name: Lightspeed Stack
      ansible.builtin.import_role:
        name: rhel.cla.lightspeed_stack
        tasks_from: k8s
