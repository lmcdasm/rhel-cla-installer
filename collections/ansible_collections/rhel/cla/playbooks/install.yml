- name: Setup RHEL CLA
  hosts: all
  become: yes

  handlers:
    - name: Restart RHEL CLA pod
      systemd:
        name: "{{ cla_pod_name }}-pod"
        state: restarted
        daemon_reload: yes
      listen:
        - init

  tasks:
    - import_role:
        name: rhel.cla.pod

    - import_role:
        name: rhel.cla.okp

    - import_role:
        name: rhel.cla.rhel_knowledge_bridge

    - import_role:
        name: rhel.cla.lightspeed_stack
