- name: Copy unit files
  template:
    src: "{{ item.name | default(item) }}"
    dest: /etc/containers/systemd/{{ item.name | default(item) | basename | replace ('.j2', '' ) | replace('okp', okp_name) }}
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - name: units/okp.container.j2
      mode: '0600'
    - units/okp.image.j2
  notify: init
  tags:
    - okp

- name: Start RHOKP
  systemd:
    name: "{{ okp_name }}"
    state: started
    daemon_reload: yes
  tags:
    - okp
