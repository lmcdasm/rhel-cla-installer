- name: Stop services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - "{{ okp_name }}"
    - "{{ okp_name }}-image"
  ignore_errors: yes
  tags:
    - okp

- name: Remove unit files
  file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  loop:
    - "{{ okp_name }}.container"
    - "{{ okp_name }}.image"
  notify: cleanup
  tags:
    - okp

- name: Remove container image
  command: podman rmi {{ okp_container_image }}:{{ okp_container_image_tag }}
  failed_when: no
  when: remove_images is defined
  tags:
    - rkb
