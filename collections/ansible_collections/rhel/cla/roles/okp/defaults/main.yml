okp_name: rh-offline-knowledge-portal
okp_container_image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9
okp_container_image_tag: 1.2.9-1784730494
# Optional digest pin (sha256:...); when set, image uses @digest instead of :tag
okp_container_image_digest: ""

okp_solr_host_bind: 0.0.0.0
okp_port: 8983
okp_http_port: 8080
okp_replicas: 1
okp_cpu_request: 1
okp_cpu_limit: 2
okp_memory_request: 2Gi
okp_memory_limit: 4Gi
okp_solr_log_level: INFO

# kubernetes.core.k8s state for tasks/k8s.yml
okp_state: present

# Shared namespace for k8s/OpenShift (omit from manifests when empty)
cla_namespace: ""
cla_pull_secret_name: ""

# Secret holding the RHOKP access key (seeded separately)
okp_access_key:
  name: okp-access-key
  key: ACCESS_KEY

# When true, mount a PVC instead of emptyDir for Solr data
okp_use_pvc: false
okp_pvc_name: rh-offline-knowledge-portal-data
okp_pvc_size: 40Gi
okp_pvc_storage_class: ""
okp_pvc_access_mode: ReadWriteOnce
