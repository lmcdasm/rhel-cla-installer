# {{ ansible_managed }}
name: lightspeed-stack

service:
  host: 0.0.0.0
  port: ${env.LS_PORT}
  root_path: /api/lightspeed
  auth_enabled: true
  workers: 1

authentication:
  module: rh-identity
  skip_for_health_probes: true
  skip_for_metrics: true
  rh_identity_config:
    required_entitlements:
      - rhel

authorization:
  access_rules:
    - role: "*"
      actions:
        - responses
        - get_metrics
        - info

conversation_cache:
  type: noop

inference:
  default_model: ${env.DEFAULT_MODEL}
  default_provider: ${env.DEFAULT_PROVIDER}

customization:
  system_prompt_path: /app-root/system_prompt.txt
  disable_query_system_prompt: true
  disable_shield_ids_override: true

mcp_servers:
  - name: okp
    provider_id: model-context-protocol
    url: http://okp-mcp:8000/mcp

deployment_environment: ${env.LS_DEPLOYMENT_ENVIRONMENT}

splunk:
  enabled: false

user_data_collection:
  feedback_enabled: false
  transcripts_enabled: false

quota_handlers:
  postgres:
    host: ${env.POSTGRES_HOST}
    port: ${env.POSTGRES_PORT}
    db: ${env.POSTGRES_DB}
    user: ${env.POSTGRES_USER}
    password: ${env.POSTGRES_PASSWORD}

ogx:
  use_as_library_client: true
  config:
    baseline: empty
    native_override:
      version: 2
      image_name: vertexai-configuration
      server:
        port: 8321

      apis:
        - files
        - inference
        - responses
        - tool_runtime
        - vector_io

      models:
        - model_id: ${env.DEFAULT_MODEL}
          model_type: llm
          provider_id: vertex-model-garden
          metadata: {}
          provider_model_id: ${env.DEFAULT_MODEL}

      providers:
        files:
          - provider_id: meta-reference-files
            provider_type: inline::localfs
            config:
              storage_dir: /tmp/files
              metadata_store:
                backend: sql_default
                table_name: files_metadata

        inference:
          - provider_id: google-vertex
            provider_type: remote::vertexai
            config:
              location: ${env.VERTEX_AI_LOCATION}
              project: ${env.VERTEXAI_PROJECT_ID}
              thought_signature_store:
                backend: kv_default
                namespace: vertexai_thought_signatures

          # OpenAI-compatible proxy for Vertex AI Model Garden models (dedicated
          # endpoints and MaaS). Point VERTEX_PROXY_URL at the vertex_proxy.py
          # instance serving the desired model (Granite, Qwen, DeepSeek, etc.).
          - provider_id: vertex-model-garden
            provider_type: remote::openai
            config:
              api_key: unused
              base_url: ${env.VERTEX_PROXY_URL}

        responses:
          - provider_id: builtin
            provider_type: inline::builtin
            config:
              persistence:
                responses:
                  backend: sql_default
                  table_name: agent_responses

        vector_io:
          - provider_id: faiss
            provider_type: inline::faiss
            config:
              persistence:
                backend: kv_default
                namespace: vector_io::faiss

        tool_runtime:
          - provider_id: model-context-protocol
            provider_type: remote::model-context-protocol
            config: {}

      storage:
        backends:
          kv_default:
            type: kv_postgres
            host: ${env.POSTGRES_HOST}
            port: ${env.POSTGRES_PORT}
            db: ${env.POSTGRES_DB}
            user: ${env.POSTGRES_USER}
            password: ${env.POSTGRES_PASSWORD}
            table_name: ogx_kvstore

          sql_default:
            type: sql_postgres
            host: ${env.POSTGRES_HOST}
            port: ${env.POSTGRES_PORT}
            db: ${env.POSTGRES_DB}
            user: ${env.POSTGRES_USER}
            password: ${env.POSTGRES_PASSWORD}
            table_name: ogx_sqlstore

        stores:
          conversations:
            backend: sql_default
            table_name: openai_conversations

          inference:
            backend: sql_default
            table_name: inference_store

          metadata:
            backend: kv_default
            namespace: registry

          prompts:
            backend: kv_default
            namespace: prompts
