- name: Stop services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - "{{ ls_name }}-image"
    - "{{ ls_name }}"
  ignore_errors: yes
  tags:
    - ls

- name: Remove unit files
  file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  loop:
    - "{{ ls_name }}.image"
    - "{{ ls_name }}.container"
  notify: cleanup
  tags:
    - ls

- name: Remove config directory
  file:
    path: "{{ ls_config_dir }}"
    state: absent
  tags:
    - ls

- name: Remove container image
  command: podman rmi {{ ls_container_image }}:{{ ls_container_image_tag }}
  failed_when: no
  when: remove_images is defined
  tags:
    - ls
