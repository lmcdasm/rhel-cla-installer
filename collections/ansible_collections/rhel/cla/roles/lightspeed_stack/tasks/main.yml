- name: Create config directory
  file:
    path: "{{ ls_config_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags:
    - ls

- name: Copy config files
  template:
    src: "{{ item }}"
    dest: "{{ ls_config_dir }}/{{ item | basename | replace('-' ~ _ls_major_version, '')}}"
  loop: "{{ ls_config_files }}"
  notify: init
  tags:
    - ls

- name: Copy unit files
  template:
    src: "{{ item }}"
    dest: /etc/containers/systemd/{{ item | basename | replace ('.j2', '' ) | replace('ls', ls_name) }}
  loop:
    - units/ls.image.j2
    - units/ls.container.j2
  notify: init
  tags:
    - ls

- name: Start Lightspeed Stack
  systemd:
    name: "{{ ls_name }}"
    state: started
    daemon_reload: yes
  tags:
    - ls
