ls_name: lightspeed-stack
ls_container_image: registry.redhat.io/lightspeed-core/lightspeed-stack-rhel9
ls_container_image_tag: 0.6.4
ls_config_dir: /var/lib/containers/lightspeed-stack
ls_config_files:
  - lightspeed-stack-{{ _ls_major_version }}.yml
  - system_prompt.txt
  - providers/{{ ls_provider }}/llama-stack.yml

ls_host: 0.0.0.0
ls_port: 8081
ls_auth_enabled: no
ls_workers: 1
ls_deployment_environment: local

ls_provider: ~
ls_default_model: ~

ls_providers:
  vertex:
    credentials_secret_name: ~
    project_id: ~
    location: global

  ramalama:
    model_id: /models/granite-4.1-8b-Q4_1.gguf
    provider_model_id: /models/granite-4.1-8b-Q4_1.gguf

  openai: {}
  rhoai: {}
