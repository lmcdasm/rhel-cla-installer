- name: VALIDATE - Flush handlers before validation
  meta: flush_handlers
  tags:
    - rkb

- name: VALIDATE - Wait for image to be pulled
  command: podman image exists {{ rkb_container_image }}
  changed_when: false
  register: _rkb_image_check
  retries: 12
  delay: 10
  until: _rkb_image_check.rc == 0
  ignore_errors: yes
  tags:
    - rkb

- name: Show image pull logs on failure
  when: _rkb_image_check is failed
  tags:
    - rkb
  block:
    - name: VALIDATE - Get image pull service logs
      command: journalctl -u {{ rkb_name }}-image --no-pager -n 10
      register: _rkb_image_logs
      changed_when: false

    - name: VALIDATE - Fail with image pull details
      fail:
        msg: |
          Image '{{ rkb_container_image }}' was not pulled after 5 minutes.
          Service logs:
          {{ _rkb_image_logs.stdout }}

- name: VALIDATE - Ensure container service is started
  systemd:
    name: "{{ rkb_name }}"
    state: started
  tags:
    - rkb
