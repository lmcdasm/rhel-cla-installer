- name: Stop services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - "{{ rkb_name }}"
    - "{{ rkb_name }}-image"
  ignore_errors: yes
  tags:
    - rkb

- name: Remove unit files
  file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  loop:
    - "{{ rkb_name }}.container"
    - "{{ rkb_name }}.image"
  notify: cleanup
  tags:
    - rkb

- name: Remove container image
  command: podman rmi {{ rkb_container_image }}
  register: _rkb_rmi
  changed_when: _rkb_rmi.rc == 0
  failed_when: false
  tags:
    - rkb
