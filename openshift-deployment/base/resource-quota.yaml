apiVersion: v1
kind: ResourceQuota
metadata:
  name: rhel-cla-quota
  namespace: rhel-cla-system
  labels:
    app.kubernetes.io/part-of: rhel-cla
spec:
  hard:
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "4"
    requests.storage: 100Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rhel-cla-limits
  namespace: rhel-cla-system
  labels:
    app.kubernetes.io/part-of: rhel-cla
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi
