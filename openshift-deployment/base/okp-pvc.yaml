apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rh-offline-knowledge-portal-data
  namespace: rhel-cla-system
  labels:
    app: rh-offline-knowledge-portal
    app.kubernetes.io/part-of: rhel-cla
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  # Uses the cluster default StorageClass (lvms-vg1 on 2026-prod-1).
