apiVersion: v1
kind: Service
metadata:
  name: rh-offline-knowledge-portal
  namespace: rhel-cla-system
  labels:
    app: rh-offline-knowledge-portal
    app.kubernetes.io/part-of: rhel-cla
spec:
  selector:
    app: rh-offline-knowledge-portal
  ports:
    - name: solr
      port: 8983
      targetPort: solr
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
