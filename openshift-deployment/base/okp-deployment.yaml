apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-offline-knowledge-portal
  namespace: rhel-cla-system
  labels:
    app: rh-offline-knowledge-portal
    app.kubernetes.io/part-of: rhel-cla
spec:
  replicas: 1
  # Recreate: RWO PVC + long Solr/index extract — RollingUpdate surges a 2nd pod
  # that cannot attach the volume and both crashloop.
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app: rh-offline-knowledge-portal
  template:
    metadata:
      annotations:
        # Bump when tar-wrapper changes so pods roll
        configmap-hash: tar-wrapper-v5
      labels:
        app: rh-offline-knowledge-portal
        app.kubernetes.io/part-of: rhel-cla
    spec:
      serviceAccountName: rh-offline-knowledge-portal
      containers:
        - name: rh-offline-knowledge-portal
          # Tag 1.2.9-1784730494 pinned by digest from lab host podman inspect
          image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9@sha256:7f4764ba3c76f1f4b062cbc7847e1eb5a06064c172030f2c9ff3e729ac637b8c
          imagePullPolicy: IfNotPresent
          ports:
            - name: solr
              containerPort: 8983
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: okp-access-key
                  key: ACCESS_KEY
            - name: SOLR_HOST_BIND
              value: "0.0.0.0"
            - name: SOLR_LOG_LEVEL
              value: INFO
            # Prefer mounted wrapper for `tar`, but keep /usr/sbin (httpd) from the image.
            - name: PATH
              value: /usr/local/bin:/usr/sbin:/sbin:/usr/bin:/bin
          volumeMounts:
            - name: solr-data
              mountPath: /opt/solr/server/solr/portal/data
            - name: tar-wrapper
              mountPath: /usr/local/bin/tar
              subPath: tar
          securityContext:
            allowPrivilegeEscalation: false
          # First boot pulls/extracts a large Lucene index; keep probes from killing it.
          # startup window ≈ initialDelay + failureThreshold*period ≈ 45m
          startupProbe:
            tcpSocket:
              port: solr
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 160
          livenessProbe:
            tcpSocket:
              port: solr
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: solr
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: solr-data
          persistentVolumeClaim:
            claimName: rh-offline-knowledge-portal-data
        - name: tar-wrapper
          configMap:
            name: rh-offline-knowledge-portal-tar-wrapper
            defaultMode: 0755
