apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhel-cla-system

resources:
  - namespace.yaml
  - resource-quota.yaml
  - networkpolicy.yaml
  - okp-sa.yaml
  - okp-pvc.yaml
  - okp-tar-wrapper-cm.yaml
  - okp-deployment.yaml
  - okp-service.yaml
  - rkb-sa.yaml
  - rkb-deployment.yaml
  - rkb-service.yaml
  - lightspeed-sa.yaml
  - lightspeed-deployment.yaml
  - lightspeed-service.yaml
  - lightspeed-route.yaml
  - granite-connectivity-job.yaml

configMapGenerator:
  - name: lightspeed-stack-config
    files:
      - lightspeed-stack.yml=config/lightspeed-stack.yml
      - llama-stack.yml=config/llama-stack.yml
      - system_prompt.txt=config/system_prompt.txt
    options:
      disableNameSuffixHash: true

generatorOptions:
  disableNameSuffixHash: true
