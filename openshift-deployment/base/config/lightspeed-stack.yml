# OCP lab overlay — derived from live Quadlet config on 10.20.1.200
name: lightspeed-stack

service:
  host: "0.0.0.0"
  port: 8081
  root_path: /api/lightspeed
  auth_enabled: False
  workers: 1

authorization:
  access_rules:
    - role: "*"
      actions:
        - rlsapi_v1_infer
        - get_metrics
        - info

conversation_cache:
  type: noop

inference:
  default_provider: ramalama
  default_model: granite-4.1-8b-Q4_1

customization:
  system_prompt_path: /app-root/system_prompt.txt
  disable_query_system_prompt: true
  disable_shield_ids_override: true

mcp_servers:
  - name: rhel-knowledge-bridge
    provider_id: model-context-protocol
    url: http://rhel-knowledge-bridge:8192/mcp

deployment_environment: openshift

splunk:
  enabled: false

user_data_collection:
  feedback_enabled: false
  transcripts_enabled: false

llama_stack:
  use_as_library_client: true
  library_client_config_path: /app-root/llama-stack.yml
