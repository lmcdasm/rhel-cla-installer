apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lightspeed-stack
  namespace: rhel-cla-system
  labels:
    app: lightspeed-stack
    app.kubernetes.io/part-of: rhel-cla
spec:
  to:
    kind: Service
    name: lightspeed-stack
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
