apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack
  namespace: rhel-cla-system
  labels:
    app: lightspeed-stack
    app.kubernetes.io/part-of: rhel-cla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-stack
  template:
    metadata:
      labels:
        app: lightspeed-stack
        app.kubernetes.io/part-of: rhel-cla
    spec:
      serviceAccountName: lightspeed-stack
      containers:
        - name: lightspeed-stack
          # Tag 0.6.4 pinned by digest from lab host podman inspect
          image: registry.redhat.io/lightspeed-core/lightspeed-stack-rhel9@sha256:4094c9b5601983497b2dac5f0e6b3e1cb8e6094eaab30f05d0a7a535a49c179c
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app-root/lightspeed-stack.yml
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SQLITE_STORE_DIR
              value: /tmp/llama-store
          volumeMounts:
            - name: stack-config
              mountPath: /app-root/lightspeed-stack.yml
              subPath: lightspeed-stack.yml
              readOnly: true
            - name: stack-config
              mountPath: /app-root/llama-stack.yml
              subPath: llama-stack.yml
              readOnly: true
            - name: stack-config
              mountPath: /app-root/system_prompt.txt
              subPath: system_prompt.txt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/lightspeed/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/lightspeed/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: stack-config
          configMap:
            name: lightspeed-stack-config
